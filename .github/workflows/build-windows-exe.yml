name: Build MarginMise Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller

      - name: Build MarginMise.exe
        shell: pwsh
        run: |
          python -m PyInstaller marginmise.spec --noconfirm --clean

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\MarginMise.exe')) {
            throw 'Build finished without creating dist\MarginMise.exe'
          }
          $exe = Get-Item 'dist\MarginMise.exe'
          Write-Host "Built: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarginMise-Windows-EXE
          path: dist/MarginMise.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
