name: Build MarginMise Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller==6.13.0

      - name: Build low-memory onedir application
        shell: pwsh
        run: |
          python -m PyInstaller marginmise_dir.spec --noconfirm --clean

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\MarginMise\MarginMise.exe')) {
            throw 'Build finished without creating dist\MarginMise\MarginMise.exe'
          }
          $exe = Get-Item 'dist\MarginMise\MarginMise.exe'
          Write-Host "Built: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Smoke test executable process behavior
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist\MarginMise\MarginMise.exe').Path
          # The path is produced by this job, not by untrusted event data.
          $check = Start-Process -FilePath $exe -ArgumentList '--startup-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            throw "MarginMise startup check failed with code $($check.ExitCode)"
          }
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "MarginMise exited during startup with code $($process.ExitCode)"
            }
            $copies = @(Get-Process -Name MarginMise -ErrorAction SilentlyContinue)
            if ($copies.Count -ne 1) {
              throw "Expected one MarginMise process, found $($copies.Count)"
            }
            Write-Host "Smoke test passed: exactly one GUI process is running."
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-Process -Name MarginMise -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarginMise-Windows-EXE
          path: dist/MarginMise
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
